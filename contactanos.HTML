<section style="background:#fffde7; font-family:Georgia, 'Times New Roman', serif; padding:60px 20px; color:#1a1a1a;">
 
  <h1 style="text-align:center; font-size:40px; font-weight:bold; margin:0 0 15px;">
    Contáctanos
  </h1>
 
  <p style="text-align:center; max-width:700px; margin:0 auto 50px; font-size:17px; line-height:1.6;">
    ¿Tienes dudas sobre tallas, envíos o pedidos personalizados? Escríbenos y con gusto te ayudamos.
  </p>
 
  <div style="max-width:900px; margin:0 auto; display:flex; flex-wrap:wrap; gap:40px; justify-content:center;">
 
    <div style="flex:1; min-width:280px; max-width:400px;">
      <h2 style="font-size:22px; font-weight:bold; margin:0 0 20px;">Información de contacto</h2>
 
      <p style="font-size:16px; margin:0 0 12px;">
        <strong>Teléfono:</strong><br>
        +57 300 123 4567
      </p>
 
      <p style="font-size:16px; margin:0 0 12px;">
        <strong>Correo:</strong><br>
        contacto@jseoversize.com
      </p>
 
      <p style="font-size:16px; margin:0 0 12px;">
        <strong>Ubicación:</strong><br>
        Medellín, Colombia
      </p>
 
      <p style="font-size:16px; margin:0;">
        <strong>Horario:</strong><br>
        Lunes a sábado, 9:00 am - 6:00 pm
      </p>
    </div>
 
    <div style="flex:1; min-width:280px; max-width:400px;">
      <h2 style="font-size:22px; font-weight:bold; margin:0 0 20px;">Escríbenos</h2>
 
      <form style="display:flex; flex-direction:column; gap:12px;">
        <input type="text" placeholder="Nombre" style="padding:10px; font-family:Georgia, serif; font-size:15px; border:1px solid #999; background:#ffffff;">
        <input type="email" placeholder="Correo electrónico" style="padding:10px; font-family:Georgia, serif; font-size:15px; border:1px solid #999; background:#ffffff;">
        <textarea placeholder="Mensaje" rows="4" style="padding:10px; font-family:Georgia, serif; font-size:15px; border:1px solid #999; background:#ffffff; resize:vertical;"></textarea>
        <button type="submit" style="padding:10px; font-family:Georgia, serif; font-size:15px; font-weight:bold; background:#e8e4a0; border:1px solid #999; cursor:pointer;">
          Enviar
        </button>
      </form>
    </div>
 
  </div>
 
</section>
